[project]
name = "borrowed-hands-helper"
version = "0.2.0"
description = "Mac-side helper for Borrowed Hands: pairs with your Hermes gateway and runs only what you granted"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9,<4", "cryptography>=42,<51"]

[project.scripts]
bh = "borrowed_hands_helper.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["borrowed_hands_helper"]

# The protocol module, its schemas and the sandbox are imported from the repo, never copied by hand:
# the wheel carries them under borrowed_hands_helper/_shared/ with the repo's relative layout, and a
# source checkout reads them from the repo root (borrowed_hands_helper/_shared.py resolves either).
[tool.hatch.build.targets.wheel.force-include]
"../protocol/bhproto.py" = "borrowed_hands_helper/_shared/protocol/bhproto.py"
"../protocol/schemas" = "borrowed_hands_helper/_shared/protocol/schemas"
"../sandbox" = "borrowed_hands_helper/_shared/sandbox"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "xcode: builds a real Xcode project (needs xcodebuild; run as yourself)",
  "integration: talks to a real local plugin server (L1)",
]
addopts = "-m 'not xcode and not integration'"
