name: RemoteDep
options:
  bundleIdPrefix: com.example.bhprobe
  deploymentTarget:
    macOS: "14.0"
packages:
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    from: 1.3.0
targets:
  RemoteDep:
    type: tool
    platform: macOS
    sources: [Sources]
    settings:
      base:
        SWIFT_VERSION: "5.0"
    dependencies:
      - package: ArgumentParser
        product: ArgumentParser
